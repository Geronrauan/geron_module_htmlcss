<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnderCraft Store — Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="nav-container">
            <div class="logo">Ender<span>Craft</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="cart.html">Корзина</a></li>
                <li><a href="profile.html" class="active">Профиль</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar">🎮</div>
                <div>
                    <h2>Steve_Player</h2>
                    <p style="color: var(--purple-light);">Текущая привилегия: VIP</p>
                </div>
            </div>

            <div class="profile-info">
                <div class="info-group">
                    <label>Никнейм на сервере:</label>
                    <span>Steve_Player</span>
                </div>
                <div class="info-group">
                    <label>Баланс счета:</label>
                    <span>0 ₽</span>
                </div>
                <div class="info-group">
                    <label>Покупок сделано:</label>
                    <span>3 товара</span>
                </div>
                <div class="info-group">
                    <label>Дата регистрации:</label>
                    <span>15.01.2026</span>
                </div>
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button class="btn">Пополнить баланс</button>
                <button class="btn btn-secondary">Выйти</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 EnderCraft Store. Все права защищены.</p>
    </footer>

</body>

</html>
